# Refreshes the profile card daily: fetch.sh pulls live numbers (npm + GitHub, all public,
# so the built-in token is enough), card.c renders the SVGs, and the bot commits only if
# something changed. data/ai.json is refreshed from the Mac (local usage logs only).
name: refresh

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC (off the hour to avoid scheduler congestion)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  card:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Fetch live numbers
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fetch.sh > data/data.txt

      - name: Render card
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -o card scripts/card.c -lm
          ./card data/data.txt assets

      - name: Commit if changed
        run: |
          git add data/data.txt assets
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "CHORE(card): Refresh stats"
          git push
