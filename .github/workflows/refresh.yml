# Refreshes the profile card daily, all in C (scripts/*.c, no libraries):
#   fetch  pulls live numbers via the gh/curl CLIs (npm + GitHub, all public, so the
#          built-in token is enough) and adds post-baseline commit increments
#   card   renders the SVGs
# The bot commits only if something changed. data/ai.json is a frozen snapshot (see ai.c).
name: refresh

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC (off the hour to avoid scheduler congestion)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  card:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -o fetch scripts/fetch.c -lm
          cc -std=c11 -O2 -Wall -Wextra -Werror -o card scripts/card.c -lm

      - name: Fetch live numbers
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./fetch > data/data.txt

      - name: Render card
        run: ./card data/data.txt assets

      - name: Commit if changed
        run: |
          git add data/data.txt assets
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "CHORE(card): Refresh stats"
          git push
